name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - run: npm ci
        working-directory: server
      - run: npm run lint
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npm test
        working-directory: server
        env:
          TEXPRESSO_LSP_ADAPTER: dist/server.mjs
      - run: cargo fmt --check
      - run: cargo check
      - run: cargo test
      - run: cargo build --release --target wasm32-wasip2
